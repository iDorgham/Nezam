# Antigravity Phase 2 Automated Branching Setup
# Manages automatic branch creation, syncing, and PR generation for .nezam/core/ structure

version: "1.0"
phase: 2
status: in_progress
created_at: 2024-12-01T00:00:00Z

# ════════════════════════════════════════════════════════════════
# BRANCHES - Auto-created at phase start
# ════════════════════════════════════════════════════════════════

branches:
  - name: reports/v3.2
    type: reports
    description: "Executive briefings, audits, and progress tracking"
    labels:
      - phase2
      - reports
      - monitoring
    source_paths:
      - .nezam/core/reports/
    entry_files:
      - v3.2_EXECUTIVE_BRIEF.md
      - v3.2_SUMMARY.md
    protection:
      require_reviews: true
      require_status_checks: true
    assignment:
      leads: ["Product Lead", "Analytics Lead"]
      reviewers: ["Executive", "QA Lead"]

  - name: plans/v3.2-health
    type: planning
    description: "Strategic roadmap, milestones, and health metrics"
    labels:
      - phase2
      - planning
      - strategy
    source_paths:
      - .nezam/core/plans/
    entry_files:
      - ROADMAP_v3.2_HEALTH_100.md
    protection:
      require_reviews: true
      require_approval_by: ["Executive", "Product Lead"]
    assignment:
      leads: ["Product Lead", "Engineering Lead"]
      reviewers: ["Executive", "Engineering Lead"]

  - name: prompts/phase2-execution
    type: execution
    description: "All execution prompts and Claude Code handoffs for all phases"
    labels:
      - phase2
      - execution
      - prompts
    source_paths:
      - .nezam/core/prompts/
    entry_files:
      - v3.2-claude-code-handoff.md
    protection:
      require_reviews: true
    assignment:
      leads: ["Engineering Lead", "Developer"]
      reviewers: ["Engineering Lead", "Architect"]

  - name: docs/quick-start
    type: documentation
    description: "Commands, quick reference, and developer onboarding"
    labels:
      - phase2
      - docs
      - reference
    source_paths:
      - .nezam/core/docs/
    entry_files:
      - v3.2-CLAUDE-CODE-QUICK-START.md
    protection:
      require_reviews: false
    assignment:
      leads: ["Doc Writer"]
      reviewers: ["Engineering Lead"]

# ════════════════════════════════════════════════════════════════
# AUTO-SYNC CONFIGURATION
# ════════════════════════════════════════════════════════════════

auto_sync:
  enabled: true
  interval: 1h
  conflict_resolution: latest_wins

  rules:
    - source: .nezam/core/reports/
      destination: reports/v3.2/
      pattern: "**/*.md"
      exclude:
        - ".gitignore"
        - "node_modules/"
      auto_commit: true
      commit_template: "docs(reports): Auto-sync from core/reports"

    - source: .nezam/core/plans/
      destination: plans/v3.2-health/
      pattern: "**/*.md"
      auto_commit: true
      commit_template: "docs(plans): Auto-sync from core/plans"

    - source: .nezam/core/prompts/
      destination: prompts/phase2-execution/
      pattern: "**/*.md"
      auto_commit: true
      commit_template: "docs(prompts): Auto-sync from core/prompts"

    - source: .nezam/core/docs/
      destination: docs/quick-start/
      pattern: "**/*.md"
      auto_commit: true
      commit_template: "docs(docs): Auto-sync from core/docs"

# ════════════════════════════════════════════════════════════════
# PULL REQUESTS - Auto-created for each branch
# ════════════════════════════════════════════════════════════════

pull_requests:
  - branch: reports/v3.2
    title: "📊 [Reports] Phase 2 Executive Briefing & Audits"
    description: |
      ## Reports Branch

      Phase 2 executive briefing, audit reports, and progress tracking.

      ### Key Files
      - **Executive Brief**: Executive overview and summary
      - **Audit Reports**: Technical and security audits
      - **Progress Reports**: Real-time progress tracking

      ### Schedule
      - Updated continuously throughout phase 2
      - Executive briefing: weekly
      - Security audits: bi-weekly

      ### Reading Order
      1. v3.2_EXECUTIVE_BRIEF.md (5 min)
      2. v3.2_SUMMARY.md (10 min)
      3. All audits in /audits/ (30+ min)
    labels: [phase2, reports, monitoring]
    reviewers: [Executive, QA Lead]

  - branch: plans/v3.2-health
    title: "🎯 [Plans] Phase 2 Strategic Roadmap & Health Metrics"
    description: |
      ## Plans Branch

      Strategic roadmap, milestones, and health metrics for phase 2.

      ### Key Files
      - **Roadmap**: Complete v3.2 health roadmap
      - **Milestones**: Phase 2 deliverables
      - **Metrics**: Health and success criteria

      ### Reading Order
      1. ROADMAP_v3.2_HEALTH_100.md (full details)
      2. Timeline and dependencies
      3. Resource allocation
    labels: [phase2, planning, strategy]
    reviewers: [Executive, Product Lead]

  - branch: prompts/phase2-execution
    title: "⚙️ [Execution] Phase 2 Claude Code Prompts & Handoffs"
    description: |
      ## Prompts Branch

      All execution prompts and Claude Code handoffs for phase 2 work.

      ### Key Files
      - **Handoff Guide**: Complete claude-code-handoff.md
      - **Phase Prompts**: All 7 phase execution prompts
      - **Integration**: Antigravity orchestration

      ### Contents
      - Planning phase execution
      - SEO/AEO phase execution
      - IA phase execution
      - Content phase execution
      - Design phase execution
      - Development phase execution
      - Release phase execution

      ### Primary Branch for Phase 2 Work
      This is the active execution branch.
    labels: [phase2, execution, prompts]
    reviewers: [Engineering Lead, Architect]

  - branch: docs/quick-start
    title: "📖 [Docs] Phase 2 Quick Start & Command Reference"
    description: |
      ## Docs Branch

      Developer onboarding and quick reference guide.

      ### Key Files
      - **Quick Start**: v3.2-CLAUDE-CODE-QUICK-START.md
      - **Commands**: All Antigravity and Claude Code commands
      - **Reference**: Function and API reference

      ### Available from Day 1
      Distribute to entire team for quick access.
    labels: [phase2, docs, reference]
    reviewers: [Engineering Lead]

# ════════════════════════════════════════════════════════════════
# STATUS MONITORING & DASHBOARDS
# ════════════════════════════════════════════════════════════════

status_checks:
  enabled: true

  checks:
    - name: "Branch Sync Health"
      branch: all
      check_interval: 1h
      conditions:
        - all_branches_exist
        - files_synced_successfully
        - no_merge_conflicts
      on_failure: notify_leads

    - name: "Reports Updated"
      branch: reports/v3.2
      check_interval: 4h
      conditions:
        - exec_brief_exists
        - summary_current
        - audits_complete
      on_failure: alert_qa_lead

    - name: "Execution Ready"
      branch: prompts/phase2-execution
      check_interval: 2h
      conditions:
        - handoff_guide_complete
        - all_phase_prompts_exist
        - no_syntax_errors
      on_failure: alert_engineering_lead

    - name: "Docs Available"
      branch: docs/quick-start
      check_interval: daily
      conditions:
        - quick_start_exists
        - links_valid
        - examples_runnable
      on_failure: notify_doc_writer

  dashboard:
    enabled: true
    refresh_interval: 30m
    display:
      - branch_status
      - pr_status
      - sync_status
      - team_assignments
      - open_questions

# ════════════════════════════════════════════════════════════════
# TEAM ASSIGNMENTS & PERMISSIONS
# ════════════════════════════════════════════════════════════════

team:
  - role: Executive
    access: read-only
    branches: [plans/v3.2-health, reports/v3.2]
    notifications: [daily_digest, critical_alerts]

  - role: Product Lead
    access: write
    branches: [plans/v3.2-health, reports/v3.2]
    notifications: [pr_updates, status_changes, blocker_alerts]

  - role: Engineering Lead
    access: write
    branches: [prompts/phase2-execution, plans/v3.2-health, docs/quick-start]
    notifications: [pr_updates, status_changes, execution_metrics]

  - role: Developer
    access: write
    branches: [prompts/phase2-execution, docs/quick-start]
    notifications: [handoff_ready, status_changes]

  - role: QA Lead
    access: write
    branches: [reports/v3.2]
    notifications: [test_results, audit_complete, status_changes]

  - role: Doc Writer
    access: write
    branches: [docs/quick-start]
    notifications: [pr_updates, sync_notifications]

  - role: Analytics Lead
    access: write
    branches: [reports/v3.2]
    notifications: [metric_updates, health_alerts]

# ════════════════════════════════════════════════════════════════
# PHASE 2 TIMELINE
# ════════════════════════════════════════════════════════════════

timeline:
  start: "Week 1 Monday"
  end: "Week 5 Friday"

  milestones:
    - date: "Week 1 Day 1"
      name: "Branch Setup"
      action: Create all 4 branches
      owner: "Antigravity Bot"
      items:
        - reports/v3.2 created
        - plans/v3.2-health created
        - prompts/phase2-execution created
        - docs/quick-start created
        - All PRs created and labelled

    - date: "Week 1 Day 2"
      name: "Briefing"
      action: Team reads all key files
      owner: "Product Lead"
      items:
        - Executive reviews brief
        - Product team reviews roadmap
        - Engineering reviews prompts
        - QA reviews audits

    - date: "Week 1 Day 5"
      name: "Planning Phase Kickoff"
      action: Begin planning phase execution
      owner: "Engineering Lead"
      items:
        - Planning phase started
        - First iteration in progress
        - Metrics baseline established

    - date: "Week 3 Day 2"
      name: "Mid-Phase Review"
      action: Progress check
      owner: "Product Lead"
      items:
        - Progress report updated
        - Metrics on track
        - Blockers identified
        - Adjustments made if needed

    - date: "Week 5 Day 5"
      name: "Phase 2 Complete"
      action: Wrap and transition to phase 3
      owner: "Project Lead"
      items:
        - All work completed
        - Final reports published
        - Lessons documented
        - Ready for phase 3

# ════════════════════════════════════════════════════════════════
# AUTOMATION ACTIONS
# ════════════════════════════════════════════════════════════════

automation_actions:
  on_create:
    - create_all_branches
    - create_all_prs
    - assign_team_members
    - send_team_notification
    - initialize_dashboard

  on_update:
    - sync_files
    - auto_commit
    - update_status
    - notify_watchers

  on_pr_merge:
    - archive_branch
    - create_release_notes
    - notify_team
    - initialize_next_phase

# ════════════════════════════════════════════════════════════════
# SUCCESS CRITERIA
# ════════════════════════════════════════════════════════════════

success_criteria:
  - all_4_branches_created: true
  - all_prs_created_and_labeled: true
  - exec_briefing_reviewed: true
  - roadmap_approved: true
  - prompts_ready: true
  - docs_published: true
  - planning_phase_started: true
  - progress_tracked: true
  - team_onboarded: true
  - metrics_baseline_established: true

# ════════════════════════════════════════════════════════════════
# NOTES
# ════════════════════════════════════════════════════════════════

notes: |
  Phase 1 Completion ✅
  Phase 2 Ready to Start 🚀

  This configuration automatically:
  - Creates all 4 branches on phase start
  - Syncs files continuously from .nezam/core/
  - Creates PRs with role-specific assignments
  - Monitors branch health
  - Tracks progress across phase 2
  - Facilitates team collaboration

  All branches are protected and require reviews.
  Sync happens automatically every hour.
  Status dashboard updates every 30 minutes.
