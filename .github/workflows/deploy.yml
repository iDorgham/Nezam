name: Deploy Pipeline

on:
  push:
    branches: [Master]
    tags: ['v*']
  pull_request:
    branches: [Master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build for staging
        run: pnpm build:staging

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          # Add your staging deployment command here
          # Example: pnpm deploy:staging
          echo "✓ Deployed to staging"

      - name: Run integration tests
        run: |
          echo "🧪 Running integration tests..."
          # Add your integration test command here
          echo "✓ Integration tests passed"

      - name: Notify deployment
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployed to staging\n- [Staging URL](https://staging.example.com)\n- All tests passed'
            })

  deploy-production:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build for production
        run: pnpm build

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add your production deployment command here
          # Example: pnpm deploy:production
          echo "✓ Deployed to production"

      - name: Smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Add your smoke test command here
          echo "✓ Smoke tests passed"

      - name: Create release notes
        uses: actions/github-script@v6
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              generate_release_notes: true
            });

      - name: Notify production deployment
        run: |
          echo "✓ Production deployment complete"
          echo "Release: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
