# created: 2026-05-10
# version: 1.1.0
# owner: PM-01
name: NEZAM PR Gates
on:
  pull_request:
    branches: [Master]

permissions:
  contents: read

jobs:
  branch-name:
    name: Enforce branch naming policy
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          # Use env var — never interpolate github.head_ref directly into run: shell
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(Master|feature/[^/]+|release/[0-9]+\.[0-9]+\.[0-9]+|hotfix/[0-9]+\.[0-9]+\.[0-9]+|plans/[^/]+|reports/[^/]+|prompts/[^/]+|docs/[^/]+|phase/[^/]+(/[^/]+)?)$'
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch '$BRANCH' violates NEZAM naming policy."
            echo "   Allowed: Master | feature/<slug> | release/x.y.z | hotfix/x.y.z | plans/<slug> | reports/<slug> | prompts/<slug> | docs/<slug> | phase/<phase>/<date>"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH' is valid."

  design-tokens:
    name: Design tokens, AI sync, SDD gates
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:tokens
      - run: pnpm ai:check
      - run: bash .nezam/core/scripts/checks/check-spec-versions.sh
      - run: bash .nezam/core/scripts/checks/check-sdd-integrity.sh
      - run: bash .nezam/core/scripts/checks/sdd-gate-validator.sh
