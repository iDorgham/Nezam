name: SDD Phase Gates

on:
  pull_request:
    branches:
      - main
    paths:
      - '.cursor/state/phase-*.yaml'
      - '.nezam/core/plans/**'
      - '.github/workflows/sdd-phase-*.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  detect-phase:
    name: Detect Active Phase
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.detect.outputs.phase }}
      is_phase_pr: ${{ steps.detect.outputs.is_phase_pr }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase from branch
        id: detect
        run: |
          BRANCH="${{ github.head_ref }}"

          # Pattern: phase/PHASE_NAME/*
          if [[ $BRANCH =~ ^phase/([a-z-]+)/ ]]; then
            PHASE="${BASH_REMATCH[1]}"
            echo "phase=$PHASE" >> $GITHUB_OUTPUT
            echo "is_phase_pr=true" >> $GITHUB_OUTPUT
            echo "✅ Detected phase: $PHASE"
          else
            echo "is_phase_pr=false" >> $GITHUB_OUTPUT
            echo "⚠️ Not a phase PR (skipping phase gates)"
          fi

  phase-requirements-gate:
    name: Phase Requirements Gate
    runs-on: ubuntu-latest
    needs: detect-phase
    if: needs.detect-phase.outputs.is_phase_pr == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Validate phase state file exists
        run: |
          PHASE="${{ needs.detect-phase.outputs.phase }}"
          STATE_FILE=".cursor/state/phase-${PHASE}.yaml"

          if [ ! -f "$STATE_FILE" ]; then
            echo "❌ Phase state file not found: $STATE_FILE"
            exit 1
          fi

          echo "✅ Phase state file exists: $STATE_FILE"

      - name: Validate progress file exists
        run: |
          PHASE="${{ needs.detect-phase.outputs.phase }}"
          PROGRESS_FILE=".nezam/core/plans/${PHASE}/progress.md"

          if [ ! -f "$PROGRESS_FILE" ]; then
            echo "❌ Phase progress file not found: $PROGRESS_FILE"
            exit 1
          fi

          echo "✅ Phase progress file exists: $PROGRESS_FILE"

      - name: Check phase status
        run: |
          PHASE="${{ needs.detect-phase.outputs.phase }}"
          STATE_FILE=".cursor/state/phase-${PHASE}.yaml"

          STATUS=$(grep "status:" "$STATE_FILE" | head -1 | awk '{print $2}' | tr -d '"')

          if [ "$STATUS" != "in_progress" ] && [ "$STATUS" != "testing" ]; then
            echo "⚠️ Phase status is not in_progress or testing: $STATUS"
          fi

          echo "✅ Phase status: $STATUS"

  phase-documentation-gate:
    name: Phase Documentation Gate
    runs-on: ubuntu-latest
    needs: detect-phase
    if: needs.detect-phase.outputs.is_phase_pr == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation completeness
        run: |
          PHASE="${{ needs.detect-phase.outputs.phase }}"
          PROGRESS_FILE=".nezam/core/plans/${PHASE}/progress.md"

          # Check for required sections
          SECTIONS=("Objectives" "Deliverables" "Status Checklist" "Notes")

          for section in "${SECTIONS[@]}"; do
            if grep -q "^## $section" "$PROGRESS_FILE"; then
              echo "✅ Found section: $section"
            else
              echo "⚠️ Missing section: $section"
            fi
          done

      - name: Verify phase progress tracked
        run: |
          PHASE="${{ needs.detect-phase.outputs.phase }}"
          PROGRESS_FILE=".nezam/core/plans/${PHASE}/progress.md"

          # Count checkboxes to ensure tracking
          BOXES=$(grep -c "- \[ \]" "$PROGRESS_FILE" || true)

          if [ "$BOXES" -gt 0 ]; then
            echo "✅ Found $BOXES tracked items in progress"
          else
            echo "⚠️ No tracked items found in progress file"
          fi

  sequential-phase-gate:
    name: Sequential Phase Gate
    runs-on: ubuntu-latest
    needs: detect-phase
    if: needs.detect-phase.outputs.is_phase_pr == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate phase sequence
        run: |
          PHASE_ORDER=("planning" "seo-aeo" "ia" "content" "design" "development" "release")
          CURRENT_PHASE="${{ needs.detect-phase.outputs.phase }}"

          # Find current phase index
          CURRENT_INDEX=-1
          for i in "${!PHASE_ORDER[@]}"; do
            if [[ "${PHASE_ORDER[$i]}" == "$CURRENT_PHASE" ]]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -eq -1 ]; then
            echo "❌ Unknown phase: $CURRENT_PHASE"
            exit 1
          fi

          # Check that all previous phases are completed
          for ((i=0; i<CURRENT_INDEX; i++)); do
            PREV_PHASE="${PHASE_ORDER[$i]}"
            STATE_FILE=".cursor/state/phase-${PREV_PHASE}.yaml"

            if [ ! -f "$STATE_FILE" ]; then
              echo "⚠️ Previous phase not started: $PREV_PHASE"
            else
              STATUS=$(grep "status:" "$STATE_FILE" | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
              if [ "$STATUS" != "completed" ] && [ "$STATUS" != "merged" ]; then
                echo "⚠️ Warning: Previous phase '$PREV_PHASE' not completed (status: $STATUS)"
              fi
            fi
          done

          echo "✅ Phase sequence validated: $CURRENT_PHASE is in correct order"

  phase-quality-gate:
    name: Phase Quality Gate
    runs-on: ubuntu-latest
    needs: detect-phase
    if: needs.detect-phase.outputs.is_phase_pr == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate state integrity
        run: pnpm run check:state
        continue-on-error: true

      - name: Check for drift
        run: pnpm run ai:check
        continue-on-error: true

  phase-conclusion:
    name: Phase Gate Status
    runs-on: ubuntu-latest
    needs: [detect-phase, phase-requirements-gate, phase-documentation-gate, sequential-phase-gate, phase-quality-gate]
    if: always() && needs.detect-phase.outputs.is_phase_pr == 'true'
    steps:
      - name: Summarize phase gates
        run: |
          echo "════════════════════════════════════════"
          echo "🚀 SDD Phase Gate Summary"
          echo "════════════════════════════════════════"
          echo ""
          echo "Phase: ${{ needs.detect-phase.outputs.phase }}"
          echo ""
          echo "Gate Results:"
          echo "  ✅ Requirements Gate: ${{ needs.phase-requirements-gate.result }}"
          echo "  ✅ Documentation Gate: ${{ needs.phase-documentation-gate.result }}"
          echo "  ✅ Sequential Gate: ${{ needs.sequential-phase-gate.result }}"
          echo "  ✅ Quality Gate: ${{ needs.phase-quality-gate.result }}"
          echo ""
          echo "🎯 All phase gates must pass to merge."
          echo "════════════════════════════════════════"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const phase = '${{ needs.detect-phase.outputs.phase }}';
            const reqGate = '${{ needs.phase-requirements-gate.result }}';
            const docGate = '${{ needs.phase-documentation-gate.result }}';
            const seqGate = '${{ needs.sequential-phase-gate.result }}';
            const qualGate = '${{ needs.phase-quality-gate.result }}';

            let statusEmoji = {
              'success': '✅',
              'failure': '❌',
              'skipped': '⊘',
              'cancelled': '⚠️'
            };

            const comment = `## 🚀 SDD Phase Gate Report

**Phase**: \`${phase}\`

### Gate Status
| Gate | Status |
|:-----|:-------|
| Requirements | ${statusEmoji[reqGate] || '⊘'} ${reqGate} |
| Documentation | ${statusEmoji[docGate] || '⊘'} ${docGate} |
| Sequential | ${statusEmoji[seqGate] || '⊘'} ${seqGate} |
| Quality | ${statusEmoji[qualGate] || '⊘'} ${qualGate} |

### Next Steps
1. Review gate results above
2. Fix any failing gates
3. Ensure all documentation is complete
4. Request review from phase lead
5. Merge when all gates pass

---

*Generated by NEZAM Phase Gate System*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
