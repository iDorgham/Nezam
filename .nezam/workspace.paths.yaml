# ==============================================================================
# NEZAM Canonical Workspace Paths Configuration
# ==============================================================================
# You can modify any of the paths below to organize your NEZAM workspace
# exactly as desired.
#
# IMPORTANT: After modifying this file, make sure to run:
#            pnpm ai:sync
# to let the AI swarm synchronized client folders respect your new structure.
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# 1. IMPORTANT DIRECTORIES & PATHS (BY LIFECYCLE PHASE)
# ──────────────────────────────────────────────────────────────────────────────
paths:
  # ────────────────────────────────────────────────────────────────────────────
  # A. PLANNING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # The documentation root folder (contains start.md, start/, Nezam/)
  docs_folder: "docs"
  # The directory containing the product definition (PRD/Project Prompt) templates
  prd_folder: "docs/start"
  # The active Product Requirements Document (PRD) file path
  prd_file: "docs/start/PRD.md"
  # The phase-based execution plans directory (where plans are stored and scaffolded)
  plan_folder: ".nezam/core/plans"
  # Active project prompt describing scope, constraints, and requirements
  project_prompt_file: "docs/start/PROJECT_PROMPT.md"
  # Planning phase roadmap specification file
  planning_roadmap_file: ".nezam/core/specs/ROADMAP.md"

  # ────────────────────────────────────────────────────────────────────────────
  # B. DESIGNING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Root brand/styling profile design hub folder
  design_hub_app_folder: ".nezam/design-hub"
  design_hub_artifacts_folder: ".nezam/design-hub/design"
  # Unified UI design token definition registry file
  design_tokens_file: ".nezam/design-hub/design/tokens.json"
  # Active branding layout and UI components contract spec
  design_spec_file: "DESIGN.md"
  # Static templates / css styling presets
  global_styles_template: ".nezam/design-hub/styles/global.template.css"
  # Wireframes drafts folder
  wireframes_folder: ".nezam/design-hub/wireframes"

  # ────────────────────────────────────────────────────────────────────────────
  # C. DEVELOPING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Primary application source code directory
  source_folder: "src"
  # Next.js app directory layout (for modern React apps)
  next_app_folder: "app"
  # Reusable UI component directories
  components_folder: "components"
  # Static public assets folder (images, fonts, static assets)
  public_folder: "public"
  # Main package node dependency config
  package_json: "package.json"
  # Hardlocked package manager lockfile
  package_lock: "pnpm-lock.yaml"
  # TypeScript runtime compilation configuration
  typescript_config: "tsconfig.json"
  # Tailwind style utilities configuration
  tailwind_config: "tailwind.config.js"
  # Next.js bundler configuration
  next_config: "next.config.js"

  # ────────────────────────────────────────────────────────────────────────────
  # D. TESTING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Root test scripts & test suite directory
  tests_folder: "tests"
  # Playwright E2E browser automation test configuration
  playwright_config: "playwright.config.ts"
  # Lighthouse CI performance & accessibility audit configuration
  lighthouse_config: ".lighthouserc.json"
  # Lighthouse engine configuration stub
  lhci_stub_folder: ".nezam/core/lhci-stub"

  # ────────────────────────────────────────────────────────────────────────────
  # E. REPORTING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Workspace reports root directory (tests, audits, security, a11y, performance)
  reports_folder: ".nezam/core/reports"
  # AI swarm operational & computation cost auditing reports
  swarm_cost_report: ".nezam/core/reports/swarm-cost.md"
  # Security vulnerability and compliance check report
  security_audit_report: ".nezam/core/reports/audits/security_report.md"
  # Modern WCAG accessibility audit compliance report
  a11y_audit_report: ".nezam/core/reports/audits/a11y_report.md"
  # Core Web Vitals performance benchmarks report
  performance_audit_report: ".nezam/core/reports/audits/performance_report.md"

  # ────────────────────────────────────────────────────────────────────────────
  # F. FIXING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Swarm architecture decisions and telemetry repair logs
  decisions_log: ".nezam/core/memory/DECISIONS_LOG.md"
  # Diagnostic health checks scripts directory
  checks_folder: ".nezam/core/scripts/checks"
  # Workspace diagnostic health check entrypoint
  health_check_script: ".nezam/core/scripts/checks/check-sdd-swarm-integrity.js"
  # Automated SDD state recovery/repair runner
  repair_state_script: ".nezam/core/scripts/checks/repair-sdd-state.sh"
  # Stale logs/docs hygiene cleanup worker
  docs_hygiene_script: ".nezam/core/scripts/maintenance/docs-hygiene.sh"

  # ────────────────────────────────────────────────────────────────────────────
  # G. VERSIONING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Canonical repository release tracking list
  changelog_file: "CHANGELOG.md"
  # Project SemVer versioning specification
  versioning_spec: ".nezam/core/specs/VERSIONING.md"
  # SDD-specific lifecycle release roadmap specification
  sdd_versioning_spec: ".nezam/core/specs/SDD_VERSIONING.md"
  # Swarm release validation & sign-off approval protocol
  release_approval_protocol: ".nezam/core/specs/RELEASE-APPROVAL-PROTOCOL.md"
  # Automated semantic release deployment workflow configuration
  semantic_release_config: "release.config.cjs"

  # ────────────────────────────────────────────────────────────────────────────
  # H. DEPLOYING PHASE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # Deployment workflow & target infrastructure configurations
  deployments_folder: ".nezam/core/gates"
  # CI/CD automation pipeline definitions (GitHub Actions)
  github_workflows: ".github/workflows"
  # Gating checks policy rules list
  gate_matrix: ".nezam/core/gates/GITHUB_GATE_MATRIX.json"
  # Git versioning hooks and checkout hooks
  git_hooks_folder: ".githooks"

  # ────────────────────────────────────────────────────────────────────────────
  # I. AI SWARM CORE PATHS
  # ────────────────────────────────────────────────────────────────────────────
  # The AI state directory (contains onboarding.yaml, plan_progress.yaml, develop_phases.yaml, agent-bus.yaml, AGENT_REGISTRY.yaml)
  state_folder: ".cursor/state"
  # The AI rules directory (contains .mdc rules)
  rules_folder: ".cursor/rules"
  # The AI skills directory (contains dynamic agent skills)
  skills_folder: ".cursor/skills"
  # The AI agents directory (contains agent definition personas)
  agents_folder: ".cursor/agents"
  # The CLI commands directory
  commands_folder: ".cursor/commands"
  # AI swarm client root index folders
  cursor_client_folder: ".cursor"
  gemini_client_folder: ".gemini"
  claude_client_folder: ".claude"
  codex_client_folder: ".codex"
  qwen_client_folder: ".qwen"
  # AI swarm settings control plane
  workspace_settings: ".nezam/core/gates/workspace.settings.yaml"
  # Swarm multi-tool index mapping file
  multi_tool_index: ".nezam/core/memory/MULTI_TOOL_INDEX.md"
  # Core framework specs directory
  specs_folder: ".nezam/core/specs"
  # Core dynamic rules verification gates folder
  gates_folder: ".nezam/core/gates"
  # Dynamic platform scripts collection
  scripts_folder: ".nezam/core/scripts"
  # Platform custom CLI tools collection
  tools_folder: ".nezam/core/tools"
  # AI swarm internal shared memory folder
  memory_folder: ".nezam/core/memory"
  # AI telemetry and inter-agent handoff context
  context_folder: ".nezam/core/context"
  # Dynamic prompt/file generators layout templates
  templates_folder: ".nezam/templates"

# ──────────────────────────────────────────────────────────────────────────────
# 2. HARDLOCK FILE PATHS
# ──────────────────────────────────────────────────────────────────────────────
# Hardlock paths are checked by sdd-gate-validator and pre-gate validation
# checkers to enforce correct SDD execution sequencing.
# ──────────────────────────────────────────────────────────────────────────────
hardlocks:
  # ────────────────────────────────────────────────────────────────────────────
  # A. PLANNING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The primary Product Requirements Document (PRD) that must exist before design
  prd: "docs/start/PRD.md"
  # The core Project Prompt defining scope boundaries & constraints
  project_prompt: "docs/start/PROJECT_PROMPT.md"
  # The primary onboarding state yaml file
  onboarding: ".cursor/state/onboarding.yaml"
  # The planning phases progress tracking file
  plan_progress: ".cursor/state/plan_progress.yaml"
  # The active subphase plans directory format
  plans_index: ".nezam/core/plans/INDEX.md"

  # ────────────────────────────────────────────────────────────────────────────
  # B. DESIGNING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The Design spec and Design contract file at the repository root for UI scopes
  design_spec: "DESIGN.md"
  # The unified design tokens json contract
  design_tokens: ".nezam/design-hub/design/tokens.json"

  # ────────────────────────────────────────────────────────────────────────────
  # C. DEVELOPING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The develop phases status and completions tracking file
  develop_phases: ".cursor/state/develop_phases.yaml"
  # The node configuration descriptor file
  package_json: "package.json"

  # ────────────────────────────────────────────────────────────────────────────
  # D. TESTING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The lighthouse automation configuration descriptor
  lhci_config: ".lighthouserc.json"

  # ────────────────────────────────────────────────────────────────────────────
  # E. REPORTING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The primary security check audit log file
  security_audit: ".nezam/core/reports/audits/security_report.md"

  # ────────────────────────────────────────────────────────────────────────────
  # F. FIXING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # Swarm architecture decisions and telemetry repair logs
  decisions_log: ".nezam/core/memory/DECISIONS_LOG.md"

  # ────────────────────────────────────────────────────────────────────────────
  # G. VERSIONING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The changelog tracking releases & features
  changelog: "CHANGELOG.md"
  # The versioning details tracking project SemVer state
  versioning: ".nezam/core/specs/VERSIONING.md"
  # Release approval sign-off protocol descriptor
  release_approval: ".nezam/core/specs/RELEASE-APPROVAL-PROTOCOL.md"

  # ────────────────────────────────────────────────────────────────────────────
  # H. DEPLOYING HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The GitHub Actions workflow gate matrix JSON enforcing quality gates
  gate_matrix: ".nezam/core/gates/GITHUB_GATE_MATRIX.json"
  # The global active workspace configuration settings
  workspace_settings: ".nezam/core/gates/workspace.settings.yaml"

  # ────────────────────────────────────────────────────────────────────────────
  # I. AI SWARM CORE HARDLOCKS
  # ────────────────────────────────────────────────────────────────────────────
  # The active message bus tracking file for AI coordination
  agent_bus: ".cursor/state/agent-bus.yaml"
  # The global AI swarm agent registry tracking skills and roles
  agent_registry: ".cursor/state/AGENT_REGISTRY.yaml"
  # Swarm multi-tool index mapping file
  multi_tool_index: ".nezam/core/memory/MULTI_TOOL_INDEX.md"
